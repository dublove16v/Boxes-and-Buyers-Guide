[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[server]
headless = true
enableXsrfProtection = false
enableCORS = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4d3a"
backgroundColor = "#f4f1ea"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c1915"
font = "Century Gothic Pro, sans-serif"
headingFont = "Century Gothic Pro, sans-serif"

[[theme.fontFaces]]
family = "Century Gothic Pro"
url = "app/static/CenturyGothicPro.otf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Century Gothic Pro"
url = "app/static/CenturyGothicPro-Bold.otf"
weight = "700"
style = "normal"
