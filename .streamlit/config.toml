[client]
toolbarMode = "minimal"

[server]
headless = true
address = "0.0.0.0"
port = 8080
enableXsrfProtection = false
enableCORS = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4d3a"
backgroundColor = "#f4f1ea"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c1915"
font = "sans serif"
